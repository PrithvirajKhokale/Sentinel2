# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint: creates the PostgreSQL database and one public web service that
# serves the read-only API (/api/v1, /docs) and the dashboard (/). No authentication.
# The Docker build downloads the five hash-verified source PDFs and rebuilds the
# dataset; first start migrates the database and imports the validated revision.
databases:
  - name: sentinel-db
    plan: free
    region: singapore
    databaseName: sentinel
    user: sentinel

services:
  - type: web
    name: sentinel
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: SENTINEL_DB_SSLMODE
        value: require
      - key: SENTINEL_FRONTEND_DIR
        value: /app/frontend/dist
