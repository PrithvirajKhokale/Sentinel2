name: Frontend integration checks
on:
  push:
    branches: [mai, main, 'fix/**', 'feat/**', 'test/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node tests/risk-browser-smoke.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
      - run: node tests/risk-browser-smoke.mjs
        working-directory: frontend
        env:
          SENTINEL_TEST_LIVE_BUILD: '1'
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend tests scripts

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_only
          POSTGRES_DB: sentinel_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BACKEND_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel_test_only@127.0.0.1:5432/sentinel_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-backend.lock
      - run: python scripts/acquire_reports.py
      - run: python scripts/rebuild_dataset.py > /tmp/sentinel-dataset.log
      - run: python scripts/check_backend.py
      - name: Verify migrations match models
        run: |
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: ${{ env.BACKEND_TEST_DATABASE_URL }}
      - name: Exercise the real frontend client against PostgreSQL
        run: |
          python -m backend.bootstrap > /tmp/sentinel-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/sentinel-api.log; exit 1; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/readyz
          node frontend/tests/live-api.mjs
        env:
          DATABASE_URL: ${{ env.BACKEND_TEST_DATABASE_URL }}
          SENTINEL_TEST_API_BASE: http://127.0.0.1:8000/api/v1

  container-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_only
          POSTGRES_DB: sentinel_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build the exact application Dockerfile
        run: docker build --tag sentinel-release-check .
      - name: Verify container, real browser and isolated backup/restore
        run: bash scripts/check_container.sh
        env:
          SENTINEL_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SENTINEL_TEST_BACKUP_PATH: ${{ runner.temp }}/sentinel-test-backup.dump
